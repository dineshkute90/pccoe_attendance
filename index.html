<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Attendance Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24">

    <div id="division-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl text-center space-y-4">
            <h2 class="text-xl font-bold text-slate-900">Select Your Division</h2>
            <p class="text-sm text-slate-500">Please choose a class to load the student list.</p>
            <div class="grid grid-cols-1 gap-3 pt-2">
                <button onclick="initDivision('FY A Mech')" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded-xl transition">
                    First Year - A Mechanical (FY A Mech)
                </button>
                <button onclick="initDivision('FY B Mech')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-3 rounded-xl transition">
                    First Year - B Mechanical (FY B Mech)
                </button>
            </div>
        </div>
    </div>

    <header class="bg-white shadow-xs border-b border-slate-200 sticky top-0 z-10 p-4 mb-6">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-slate-900" id="current-division-title">No Division Selected</h1>
                <div class="flex items-center gap-2 mt-1">
                    <input type="date" id="attendance-date" class="bg-slate-100 border-0 rounded px-2 py-1 text-xs font-semibold text-slate-600">
                    <button onclick="changeDivision()" class="text-xs text-blue-600 font-medium hover:underline">Change Division ⇄</button>
                </div>
            </div>
            
            <div class="grid grid-cols-3 gap-3 text-center font-bold text-xs max-w-sm w-full md:w-auto">
                <div class="bg-slate-100 p-2 rounded-lg">Total: <span id="stat-total" class="block text-lg">0</span></div>
                <div class="bg-emerald-100 text-emerald-800 p-2 rounded-lg">Present: <span id="stat-present" class="block text-lg">0</span></div>
                <div class="bg-rose-100 text-rose-800 p-2 rounded-lg">Absent: <span id="stat-absent" class="block text-lg">0</span></div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4">
        <div class="bg-white p-4 rounded-xl shadow-xs border border-slate-200 flex flex-col sm:flex-row gap-3 justify-between items-center mb-6">
            <input type="text" id="search-box" placeholder="Search name or roll no..." class="w-full sm:max-w-xs px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="setAllStatuses(true)" class="flex-1 bg-emerald-600 text-white text-xs font-semibold px-4 py-2 rounded-lg hover:bg-emerald-700">All Present</button>
                <button onclick="setAllStatuses(false)" class="flex-1 bg-rose-600 text-white text-xs font-semibold px-4 py-2 rounded-lg hover:bg-rose-700">Clear All</button>
            </div>
        </div>

        <div id="student-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
            </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg z-20">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="w-full sm:max-w-md">
                <input type="email" id="teacher-email" placeholder="Enter your email to receive report" class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button onclick="submitAndMailAttendance()" class="w-full sm:w-auto bg-slate-900 text-white px-6 py-2.5 rounded-xl font-bold text-sm hover:bg-slate-800 transition shadow">
                Submit & Email Absentees
            </button>
        </div>
    </div>

    <script>
        // Initialize EmailJS with your Public Key
        (function() {
            emailjs.init("ECil5VBB0bv28ETbF"); 
        })();

        // Student Data Lists mapped from your original files
        const divisionDatabases = {
            "FY A Mech": [
                { id: "125B1F001", name: "Neeraj Bhosale" },
                { id: "125B1F002", name: "Suhan Tadavi" },
                { id: "125B1F003", name: "AAYUSHA CHALKE" },
                { id: "125B1F004", name: "Aryan Ghate" },
                { id: "125B1F005", name: "PARESH THORAT" },
                { id: "125B1F006", name: "kashish jangid" },
                { id: "125B1F007", name: "ANSH RAINA" }
            ],
            "FY B Mech": [
                { id: "125B1F058", name: "GAJANAN PATIL" },
                { id: "125B1F059", name: "AMRUTA BIRADAR" },
                { id: "125B1F060", name: "Utkarsh Mutha" },
                { id: "125B1F061", name: "ansh dhundale" },
                { id: "125B1F062", name: "SHIVANI PATHAVE" }
            ]
        };

        let currentDivision = "";
        let attendanceRecords = {};

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('attendance-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('search-box').addEventListener('input', (e) => renderGrid(e.target.value));
        });

        function initDivision(divName) {
            currentDivision = divName;
            document.getElementById('current-division-title').innerText = divName;
            document.getElementById('division-modal').classList.add('hidden');
            
            // Default everyone to present
            attendanceRecords = {};
            divisionDatabases[currentDivision].forEach(student => {
                attendanceRecords[student.id] = true;
            });
            
            renderGrid();
        }

        function changeDivision() {
            document.getElementById('division-modal').classList.remove('hidden');
        }

        function renderGrid(filterText = "") {
            const gridContainer = document.getElementById('student-grid');
            gridContainer.innerHTML = "";

            if (!currentDivision) return;

            const filtered = divisionDatabases[currentDivision].filter(s => 
                s.name.toLowerCase().includes(filterText.toLowerCase()) || 
                s.id.includes(filterText)
            );

            filtered.forEach(student => {
                const isPresent = attendanceRecords[student.id];
                const card = document.createElement('div');
                
                // Toggle structure inspired by the layout provided
                card.className = `p-3 rounded-xl border flex items-center gap-3 cursor-pointer select-none transition-all ${
                    isPresent ? 'bg-emerald-50/60 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'
                }`;
                card.onclick = () => {
                    attendanceRecords[student.id] = !attendanceRecords[student.id];
                    renderGrid(document.getElementById('search-box').value);
                };

                card.innerHTML = `
                    <input type="checkbox" ${isPresent ? 'checked' : ''} class="accent-emerald-600 rounded pointer-events-none">
                    <div class="truncate">
                        <p class="text-xs font-mono text-slate-500">${student.id}</p>
                        <p class="text-sm font-semibold truncate">${student.name}</p>
                    </div>
                `;
                gridContainer.appendChild(card);
            });

            calculateMetrics();
        }

        function setAllStatuses(status) {
            if(!currentDivision) return;
            divisionDatabases[currentDivision].forEach(student => {
                attendanceRecords[student.id] = status;
            });
            renderGrid(document.getElementById('search-box').value);
        }

        function calculateMetrics() {
            const students = divisionDatabases[currentDivision] || [];
            const total = students.length;
            const present = students.filter(s => attendanceRecords[s.id]).length;
            const absent = total - present;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-present').innerText = present;
            document.getElementById('stat-absent').innerText = absent;
        }

        function submitAndMailAttendance() {
            const emailInput = document.getElementById('teacher-email').value.trim();
            if (!emailInput) {
                alert("⚠️ Please type your Email ID first to receive the report.");
                return;
            }

            const students = divisionDatabases[currentDivision];
            const absentStudents = students.filter(s => !attendanceRecords[s.id]);
            const presentCount = students.length - absentStudents.length;

            // Generate structured text list for email layout
            let absentListText = absentStudents.map((s, idx) => `${idx + 1}. ${s.id} - ${s.name}`).join("\n");
            if (absentStudents.length === 0) absentListText = "All students were present!";

            // Prepare values to send to EmailJS template parameters
            const templateParams = {
                to_email: emailInput,
                date: document.getElementById('attendance-date').value,
                division: currentDivision,
                present_count: presentCount,
                absent_count: absentStudents.length,
                absent_list: absentListText
            };

            // Send via EmailJS
            emailjs.send('service_1el0vfe', 'template_94vwd08', templateParams)
                .then(() => {
                    alert(`✅ Attendance submitted successfully!\nAn absent list report has been sent to: ${emailInput}`);
                }, (error) => {
                    alert("❌ Email delivery failed. Please check your EmailJS Credentials.");
                    console.error("EmailJS Error:", error);
                });
        }
    </script>
</body>
</html>
