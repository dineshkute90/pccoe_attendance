<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Attendance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900">Attendance Record</h1>
                    <p class="text-sm text-slate-500">B.Tech Electronics & Telecommunication (Div A)</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Session Date</label>
                    <input type="date" id="attendance-date" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 font-medium text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-slate-50 border border-slate-100 p-4 rounded-xl">
                    <span class="block text-xs font-semibold text-slate-400 uppercase">Total Students</span>
                    <span id="stat-total" class="text-2xl font-extrabold text-slate-900">0</span>
                </div>
                <div class="bg-emerald-50 border border-emerald-100 p-4 rounded-xl">
                    <span class="block text-xs font-semibold text-emerald-600 uppercase">Present</span>
                    <span id="stat-present" class="text-2xl font-extrabold text-emerald-700">0</span>
                </div>
                <div class="bg-rose-50 border border-rose-100 p-4 rounded-xl">
                    <span class="block text-xs font-semibold text-rose-600 uppercase">Absent</span>
                    <span id="stat-absent" class="text-2xl font-extrabold text-rose-700">0</span>
                </div>
                <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl">
                    <span class="block text-xs font-semibold text-blue-600 uppercase">Attendance %</span>
                    <span id="stat-percentage" class="text-2xl font-extrabold text-blue-700">0%</span>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="w-full sm:max-w-xs relative">
                <input type="text" id="search-input" placeholder="Quick search name or Reg No..." class="w-full bg-slate-50 border border-slate-300 rounded-lg pl-3 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="markAll(true)" class="flex-1 sm:flex-initial bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs px-4 py-2 rounded-lg transition">All Present</button>
                <button onclick="markAll(false)" class="flex-1 sm:flex-initial bg-rose-600 hover:bg-rose-700 text-white font-medium text-xs px-4 py-2 rounded-lg transition">All Absent</button>
                <button onclick="clearSavedData()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium text-xs px-3 py-2 rounded-lg transition" title="Reset Storage">Reset</button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full border-collapse text-left text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-400 font-semibold text-xs tracking-wider uppercase">
                            <th class="p-4 w-16 text-center">Sr.</th>
                            <th class="p-4">Registration No.</th>
                            <th class="p-4">Student Name</th>
                            <th class="p-4 w-32 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body" class="divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
        </div>

        <div class="flex justify-end">
            <button onclick="exportData()" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm px-6 py-2.5 rounded-xl shadow-md transition">
                Export & Save Sheet
            </button>
        </div>

    </div>

    <script>
        // Real data parsing extracted directly from user's uploaded dashboard sheet
        const originalClassList = [
            { regNo: "124B1E002", name: "Nishant Prashant Ghotkar" },
            { regNo: "125B2E008", name: "Kaustubh Ravindra Firke" }
        ];

        let attendanceState = {};
        const datePicker = document.getElementById('attendance-date');

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            // Set current date string format (YYYY-MM-DD)
            const today = new Date().toISOString().split('T')[0];
            datePicker.value = today;

            // Load existing records or define clean layout state
            loadAttendanceForDate(today);

            // Setup Event Handlers
            datePicker.addEventListener('change', (e) => loadAttendanceForDate(e.target.value));
            document.getElementById('search-input').addEventListener('input', (e) => renderTable(e.target.value));
        });

        function loadAttendanceForDate(date) {
            const stored = localStorage.getItem(`attendance_${date}`);
            if (stored) {
                attendanceState = JSON.parse(stored);
            } else {
                // Default every student to Present (Optimistic fast data-entry)
                attendanceState = {};
                originalClassList.forEach(student => {
                    attendanceState[student.regNo] = true; 
                });
                saveToStorage();
            }
            renderTable();
        }

        function renderTable(filterText = "") {
            const tableBody = document.getElementById('student-table-body');
            tableBody.innerHTML = "";

            const filteredList = originalClassList.filter(s => 
                s.name.toLowerCase().includes(filterText.toLowerCase()) ||
                s.regNo.toLowerCase().includes(filterText.toLowerCase())
            );

            filteredList.forEach((student, index) => {
                const isPresent = attendanceState[student.regNo];
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50/70 transition-colors";
                
                row.innerHTML = `
                    <td class="p-4 text-center text-slate-400 font-medium">${index + 1}</td>
                    <td class="p-4 font-mono text-xs text-slate-500 tracking-tight">${student.regNo}</td>
                    <td class="p-4 font-semibold text-slate-800">${student.name}</td>
                    <td class="p-4 text-center">
                        <button onclick="toggleStatus('${student.regNo}')" class="w-24 py-1.5 px-3 rounded-full text-xs font-bold tracking-wide transition-all uppercase ${
                            isPresent 
                            ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' 
                            : 'bg-rose-100 text-rose-800 border border-rose-300'
                        }">
                            ${isPresent ? 'Present' : 'Absent'}
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            calculateStats();
        }

        function toggleStatus(regNo) {
            attendanceState[regNo] = !attendanceState[regNo];
            saveToStorage();
            renderTable(document.getElementById('search-input').value);
        }

        function markAll(status) {
            originalClassList.forEach(student => {
                attendanceState[student.regNo] = status;
            });
            saveToStorage();
            renderTable(document.getElementById('search-input').value);
        }

        function calculateStats() {
            const total = originalClassList.length;
            let presentCount = 0;

            originalClassList.forEach(student => {
                if (attendanceState[student.regNo]) presentCount++;
            });

            const absentCount = total - presentCount;
            const percentage = total > 0 ? Math.round((presentCount / total) * 100) : 0;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-present').innerText = presentCount;
            document.getElementById('stat-absent').innerText = absentCount;
            document.getElementById('stat-percentage').innerText = `${percentage}%`;
        }

        function saveToStorage() {
            const currentDate = datePicker.value;
            localStorage.setItem(`attendance_${currentDate}`, JSON.stringify(attendanceState));
        }

        function clearSavedData() {
            if(confirm("Are you sure you want to clear current logs?")) {
                localStorage.clear();
                loadAttendanceForDate(datePicker.value);
            }
        }

        function exportData() {
            const currentDate = datePicker.value;
            let csvContent = "data:text/csv;charset=utf-8,Sr No,Registration Number,Student Name,Status\n";
            
            originalClassList.forEach((student, index) => {
                const statusStr = attendanceState[student.regNo] ? "Present" : "Absent";
                csvContent += `${index + 1},${student.regNo},"${student.name}",${statusStr}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Attendance_Report_Div_A_${currentDate}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
